<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>SYSTeM</title>

    <link rel="stylesheet" href="css/system.css">
</head>

<body>

    <main class="system">

        <!-- HEADER -->
        <header class="system-header">

            <div class="system-name">
                SYSTeM
            </div>

            <div class="system-meta">
                <div class="version">
                    CORE v0.1.0
                </div>

                <div class="online">
                    <span class="status-dot"></span>
                    <span data-i18n="header.online">ONLINE</span>
                </div>
            </div>

        </header>


        <!-- SYSTEM STATUS -->
        <section class="panel status-panel">

            <div class="panel-title" data-i18n="status.title">
                SYSTEM STATUS
            </div>

            <div class="status-row">
                <div class="status-label" data-i18n="status.status">
                    STATUS
                </div>

                <div class="status-value" data-i18n="status.online">
                    ONLINE
                </div>
            </div>

            <div class="status-row">
                <div class="status-label" data-i18n="status.user">
                    USER
                </div>

                <div
                    class="status-value"
                    data-i18n="status.unknown"
                >
                    UNKNOWN
                </div>
            </div>

            <div class="status-row">
                <div class="status-label" data-i18n="status.purpose">
                    PURPOSE
                </div>

                <div
                    class="status-value"
                    data-i18n="status.unknown"
                >
                    UNKNOWN
                </div>
            </div>

        </section>


        <!-- PROCESS -->
        <section class="panel process-panel">

            <div class="panel-title" data-i18n="process.title">
                PROCESS
            </div>

            <div class="process-content">

                <div class="resource-label" data-i18n="process.resource">
                    RESOURCE
                </div>

                <div
                    id="resource-value"
                    class="resource-value"
                >
                    000005
                </div>

                <button
                    id="process-button"
                    class="process-button"
                    type="button"
                >
                    [ PROCESS ]
                </button>

            </div>

        </section>


        <!-- SYSTEM LOG -->
        <section class="panel log-panel">

            <div class="panel-title" data-i18n="log.title">
                SYSTEM LOG
            </div>

            <div
                id="system-log"
                class="system-log"
                aria-live="polite"
            >
                <!-- Logs inserted by JS -->
            </div>

        </section>


        <!-- FOOTER -->
        <footer class="system-footer">

            <div>
                SYSTeM
            </div>

            <div data-i18n="footer.ready">
                STATE: READY
            </div>

        </footer>

    </main>


    <!-- LANGUAGE DATA -->
    <script src="js/locales.js"></script>

    <!-- SYSTEM CORE -->
    <script src="js/system.js"></script>

</body>
</html>
